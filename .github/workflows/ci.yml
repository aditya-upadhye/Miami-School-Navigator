name: CI

# Manual-only in generated apps (saves Actions minutes). To re-enable, restore the push/pull_request triggers here.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; a push to master always runs to
  # completion so every master commit keeps a real, finished CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Bun version comes from package.json "packageManager" (single source of truth).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # No secrets: every dependency is public, and with NPM_TOKEN/GH_PACKAGES_TOKEN
      # unset the .npmrc auth lines expand to empty and install still succeeds
      # (verified in a clean copy).
      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run lint

      - name: Laws gate
        run: bun run lint:laws

      - run: bun test
